<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>교사로 다시 태어나기</title>
<style>
@font-face{font-family:'Galmuri11';src:url('Galmuri11.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Galmuri11';src:url('Galmuri11-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--ink:#1a1c2c;--dk:#333c57;--navy:#29366f;--gry:#566c86;--lgr:#94b0c2;--wht:#f4f4f4;--yel:#ffcd75;--org:#ef7d57;--red:#b13e53;--grn:#38b764;--sky:#41a6f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0e17;color:var(--wht);font-family:'Galmuri11',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:1100px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--ink)}
#hud{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding:12px 132px 12px 16px;background:var(--dk);border-bottom:4px solid var(--navy);font-size:clamp(20px,3vw,28px);line-height:1.35}
#hud .nm{font-weight:700;color:var(--yel)}
#hud .ag{color:var(--org)}
#hud .rl{color:var(--lgr)}
#hud .pl{width:100%;color:var(--lgr);font-size:clamp(16px,2.2vw,21px)}
#prog{flex:none;display:flex;gap:3px;padding:6px 12px;background:var(--ink)}
#prog i{flex:1;height:12px;background:var(--dk)}
#prog i.d{background:var(--org)}
#prog i.c{background:var(--yel)}
.p2 #prog{background:#808080}.p2 #prog i{background:#c0c0c0;box-shadow:inset 1px 1px 0 #404040}.p2 #prog i.d{background:#0a246a;box-shadow:none}.p2 #prog i.c{background:#3a6ea5;box-shadow:none}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;cursor:pointer}
#scene{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(26,28,44,.86);opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;padding:0 16px}
#banner.on{opacity:1;pointer-events:auto}
#banner .by{font-size:clamp(34px,7vw,64px);font-weight:700;color:var(--yel);text-shadow:4px 4px 0 var(--red)}
#banner .bt{font-size:clamp(22px,4vw,36px)}
#dlg{position:relative;flex:none;margin:10px 12px 8px;padding:14px 18px 34px;height:220px;overflow:hidden;background:var(--ink);border:4px solid var(--wht);box-shadow:inset 0 0 0 4px var(--navy);cursor:pointer}
#who,#whoM{display:inline-block;margin:0 0 8px;padding:3px 10px;background:var(--red);font-size:clamp(19px,2.6vw,26px);font-weight:700;min-width:1em}
#who.hid{visibility:hidden}
#txt,#txtM{font-size:clamp(23px,3.3vw,34px);line-height:1.55;white-space:pre-wrap;word-break:keep-all}
#next{position:absolute;right:14px;bottom:8px;color:var(--yel);font-size:20px;animation:blink 1s steps(2) infinite;visibility:hidden}
@keyframes blink{50%{opacity:0}}
#choices,#choicesM{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#choices .btn,#choicesM .btn{flex:1 1 220px}
.btn{font:inherit;font-size:clamp(19px,2.6vw,24px);color:var(--ink);background:var(--yel);border:none;box-shadow:0 5px 0 var(--org),inset 0 0 0 3px var(--ink);padding:12px 16px;cursor:pointer;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--org),inset 0 0 0 3px var(--ink)}
.btn.alt{background:var(--lgr);box-shadow:0 5px 0 var(--gry),inset 0 0 0 3px var(--ink)}
#bar{flex:none;display:flex;gap:12px;padding:4px 12px 14px}
#bar .btn{flex:1}
#icons{position:absolute;top:10px;right:12px;z-index:30;display:flex;gap:8px}
.ic{width:52px;height:46px;font:inherit;font-size:24px;line-height:1;color:var(--ink);background:var(--yel);border:none;box-shadow:0 4px 0 var(--org),inset 0 0 0 3px var(--ink);cursor:pointer;padding:0}
.ic.off{background:var(--lgr);box-shadow:0 4px 0 var(--gry),inset 0 0 0 3px var(--ink)}
#snd{position:absolute;top:68px;right:12px;z-index:31;width:min(360px,calc(100% - 24px));padding:18px;background:var(--ink);border:4px solid var(--wht);box-shadow:inset 0 0 0 4px var(--navy);display:none}
#snd.on{display:block}
#snd label{display:block;font-size:20px;margin:4px 0 8px}
#snd input[type=range]{width:100%;height:32px;accent-color:var(--yel);margin:0 0 14px}
#snd .val{float:right;color:var(--yel)}
.ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;padding:72px 16px 16px;overflow:auto;background:rgba(26,28,44,.95)}
.ov.on{display:flex}
#menu,#refs,#end{background:var(--ink)}
.panel{width:100%;max-width:860px;margin:auto;padding:24px 22px;background:var(--ink);border:4px solid var(--wht);box-shadow:inset 0 0 0 4px var(--navy)}
.panel h2{margin:0 0 6px;font-size:clamp(17px,2.4vw,22px);color:var(--org)}
.panel h3{margin:0 0 18px;font-size:clamp(26px,4vw,38px);color:var(--yel);line-height:1.35}
.panel p{margin:0 0 14px;font-size:clamp(19px,2.6vw,24px);line-height:1.7;word-break:keep-all}
.src{margin:18px 0 18px;padding-top:14px;border-top:3px dashed var(--gry);font-size:clamp(16px,2.2vw,20px);line-height:1.8}
.src a,#refs a{color:var(--sky);text-decoration:none;border-bottom:2px solid var(--sky)}
.tag{display:inline-block;margin-right:8px;padding:0 6px;font-size:.78em;color:var(--ink);background:var(--lgr)}
.tag.t1{background:var(--yel)}.tag.t2{background:var(--grn)}.tag.t3{background:var(--sky)}.tag.t4{background:var(--org)}
.wide{width:100%}
#menu .panel{border:none;box-shadow:none;background:transparent;text-align:center;padding:8px 4px}
#menuArt{width:100%;max-width:640px;aspect-ratio:160/100;image-rendering:pixelated;border:4px solid var(--wht);box-shadow:inset 0 0 0 4px var(--navy)}
#menu .big{cursor:pointer;font-size:clamp(38px,8vw,72px);font-weight:700;color:var(--yel);text-shadow:4px 4px 0 var(--red);margin:20px 0 24px;line-height:1.3}
.part{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto 16px;font-size:clamp(22px,3.2vw,30px);padding:16px 20px}
.part small{font-size:.7em;opacity:.75}
#p2{background:#73eff7;box-shadow:0 5px 0 #257179,inset 0 0 0 3px var(--ink)}
#p2:active{box-shadow:0 1px 0 #257179,inset 0 0 0 3px var(--ink)}
#p2.locked{background:var(--dk);color:var(--gry);box-shadow:0 5px 0 #22283d,inset 0 0 0 3px var(--gry);cursor:not-allowed}
.part.locked{background:var(--dk);color:var(--gry);box-shadow:0 5px 0 #22283d,inset 0 0 0 3px var(--gry);cursor:not-allowed}
#refs ol{margin:0 0 16px;padding-left:28px;font-size:clamp(17px,2.4vw,22px);line-height:1.7}
#refs li{margin-bottom:8px}
#refs .fn{font-size:clamp(16px,2.2vw,20px);color:var(--lgr)}
#intro{background:#000;justify-content:center;align-items:center;cursor:pointer}
#introTxt{white-space:pre-line;font-size:clamp(28px,5.5vw,48px);line-height:1.7;text-align:center;padding:0 20px;word-break:keep-all}
#introNext{color:var(--yel);font-size:28px;margin-top:22px;animation:blink 1s steps(2) infinite;visibility:hidden}
#log ul{list-style:none;margin:0;padding:0}
#log li{padding:10px 0;border-bottom:3px dashed var(--dk);font-size:clamp(18px,2.5vw,23px);line-height:1.5}
#log li b{color:var(--org);font-weight:400;margin-right:10px}
#log{z-index:20}
#confirm{z-index:40;justify-content:center;background:rgba(13,14,23,.85)}
#confirm .panel{max-width:520px;text-align:center}
.row{display:flex;gap:12px}.row .btn{flex:1}
#txt.nar{color:var(--lgr)}
#dlgM{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;height:auto!important;overflow:visible!important;z-index:-1}

/* 2부: 90년대 PC 창 */
.p2{--bev:inset -3px -3px 0 #404040,inset 3px 3px 0 #fff,inset -6px -6px 0 #808080}
#app.p2{background:#008080}
.p2 #hud{background:#d4d0c8;color:#111;border-bottom:4px solid #808080}
.p2 #hud .nm{color:#0a246a}.p2 #hud .ag{color:#a1262a}.p2 #hud .rl,.p2 #hud .pl{color:#404040}
.p2 #banner{background:rgba(0,96,96,.9)}
.p2 #banner .by{color:#b8f28c;text-shadow:4px 4px 0 #0a246a}
.p2 #dlg{background:#d4d0c8;color:#111;border:none;box-shadow:var(--bev)}
.p2 #who{background:#0a246a;color:#fff}
.p2 #txt.nar{color:#505a66}
.p2 #next{color:#0a246a}
.p2 .btn,.p2 .btn.alt{background:#d4d0c8;color:#111;box-shadow:var(--bev)}
.p2 .btn:active{transform:none;box-shadow:inset 3px 3px 0 #404040,inset -3px -3px 0 #fff}
.p2 .ic,.p2 .ic.off{background:#d4d0c8;color:#111;box-shadow:inset -3px -3px 0 #404040,inset 3px 3px 0 #fff}
.p2 .ov{background:rgba(0,128,128,.96)}
.p2 #refs,.p2 #end{background:#008080}
.p2 .panel{background:#d4d0c8;color:#111;border:none;box-shadow:var(--bev);padding-top:0}
.p2 .panel h2{margin:0 -22px 14px;padding:8px 22px;background:#0a246a;color:#fff}
.p2 .panel h3{color:#0a246a}
.p2 .src{border-top-color:#808080}
.p2 .src a,.p2 #refs a{color:#0000a8;border-bottom-color:#0000a8}
.p2 #refs .fn{color:#404040}
.p2 #log li{border-bottom-color:#a0a0a0}.p2 #log li b{color:#a1262a}
.p2 #snd{background:#d4d0c8;color:#111;border:none;box-shadow:var(--bev)}.p2 #snd .val{color:#0a246a}
.p2 #confirm p{color:#111}
.p2 #endNext,.p2 #confirm p+p{color:#505a66!important}
</style>
</head>
<body>
<div id="app">
  <div id="icons">
    <button class="ic" id="bVol" aria-label="음량 조절">≡</button>
    <button class="ic" id="mute" aria-label="소리 끄기">♪</button>
  </div>
  <div id="snd">
    <label>음악 <span class="val" id="vMusicV"></span></label>
    <input type="range" id="vMusic" min="0" max="100" step="5">
    <label>효과음 <span class="val" id="vSfxV"></span></label>
    <input type="range" id="vSfx" min="0" max="100" step="5">
    <button class="btn wide" id="bVolClose">닫기</button>
  </div>

  <div id="hud">
    <span class="nm" id="hName">정만석</span><span id="hYear">—</span><span class="ag" id="hAge"></span><span class="rl" id="hRole"></span>
    <span class="pl" id="hPlace"></span>
  </div>
  <div id="prog"></div>
  <div id="stage">
    <canvas id="scene" width="160" height="100"></canvas>
    <div id="banner"><div class="by" id="bYear"></div><div class="bt" id="bTitle"></div></div>
  </div>
  <div id="dlg">
    <div id="who"></div>
    <div id="txt"></div>
    <div id="choices"></div>
    <div id="next">▼</div>
  </div>
  <div id="dlgM"><div id="whoM" class="x"></div><div id="txtM"></div><div id="choicesM"></div></div>
  <div id="bar">
    <button class="btn alt" id="bLog">인생 기록</button>
    <button class="btn alt" id="bHome">메인으로</button>
  </div>

  <div class="ov on" id="menu">
    <div class="panel">
      <canvas id="menuArt" width="160" height="100"></canvas>
      <div class="big">교사로<br>다시 태어나기</div>
      <button class="btn part" id="p1"><span>1부 · 정만석</span><small>1946 — 1992</small></button>
      <button class="btn part" id="p2"><span>2부 · 윤혜경</span><small id="p2y">1987 — 2027</small></button>
      <button class="btn part locked" id="p3" disabled><span>3부</span><small>잠겨 있음</small></button>
    </div>
  </div>

  <div class="ov" id="refs">
    <div class="panel">
      <h2 id="refsPart">1부 · 정만석</h2>
      <h3>이 게임은 다음과 같은 내용을 참조해 만들어졌습니다</h3>
      <ol id="refsList"></ol>
      <p class="fn">인물과 대사는 지어낸 것이며, 사건마다 열리는 「그때는」은 기록입니다.</p>
      <button class="btn wide" id="bRefsGo">시작하기</button>
    </div>
  </div>

  <div class="ov" id="intro">
    <div id="introTxt"></div>
    <div id="introNext">▼</div>
  </div>

  <div class="ov" id="card">
    <div class="panel">
      <h2 id="cYear"></h2>
      <h3 id="cTitle"></h3>
      <div id="cBody"></div>
      <div class="src" id="cSrc"></div>
      <button class="btn wide" id="bCardNext"></button>
    </div>
  </div>

  <div class="ov" id="log">
    <div class="panel">
      <h3>인생 기록</h3>
      <ul id="logList"></ul>
      <button class="btn wide" id="bLogClose" style="margin-top:18px">닫기</button>
    </div>
  </div>

  <div class="ov" id="end">
    <div class="panel" style="text-align:center">
      <h2 id="endH2"></h2>
      <h3 id="endH3"></h3>
      <p id="endP"></p>
      <p style="color:var(--lgr)" id="endNext"></p>
      <button class="btn wide" id="bEndLog" style="margin-bottom:14px">인생 기록 보기</button>
      <button class="btn alt wide goMenu">메인으로</button>
    </div>
  </div>

  <div class="ov" id="confirm">
    <div class="panel">
      <p style="font-size:clamp(22px,3vw,28px)">메인 화면으로 돌아가시겠습니까?</p>
      <p style="color:var(--lgr);font-size:clamp(17px,2.3vw,20px)">지금까지의 진행은 저장되지 않습니다.</p>
      <div class="row"><button class="btn" id="bYes">돌아가기</button><button class="btn alt" id="bNo">계속하기</button></div>
    </div>
  </div>
</div>
<script>
const S={기록원:'t1',원문:'t2',연구:'t3',보도:'t4',교총:'t5','2차':'t5','미군정 문서':'t1',사전:'t3',유물:'t2'};
const EV1 = [
 {y:'1945', age:18, t:'절반만 남은 교무실', role:'졸업생', place:'전남 보성, 모교 국민학교', sc:'office', mu:'B',
  L:[["", "1945년 가을. 중학교를 마친 정만석은 어릴 적 다닌 국민학교를 찾아갔다."], ["옛 담임", "아이고, 만석이 아니냐. 몰라보게 컸구나."], ["정만석", "선생님, 그간 평안하셨습니까. 학교가 왜 이리 조용합니까?"], ["옛 담임", "일본인 교장도, 일본인 선생들도 다 떠났다."], ["", "교무실 책상은 절반이 비어 있었다."], ["옛 담임", "아이들은 오는데 가르칠 사람이 없어."], ["옛 담임", "너처럼 중학교까지 마친 사람이 있어야 한다. 선생 기르는 강습이 곧 열린다더라."], ["정만석", "제가… 선생 노릇을 해도 되겠습니까?"], ["옛 담임", "구구단 못 외워 남던 녀석이 선생이라. 누구나 처음은 있는 법이다."]],
  card:['해방과 함께 초등교원의 40% 이상을 차지하던 일본인 교원이 떠났다.',
        '모자란 교사를 메우는 일이 해방 직후 학교의 급한 과제가 됐다.'],
  src:[['기록원','국가기록원 — 교원양성 정책 주제설명','https://www.archives.go.kr/next/search/listSubjectDescription.do?id=003190']]},

 {y:'1946', age:19, t:'석 달짜리 선생님', role:'양성소 강습생', place:'전남, 임시 초등교원양성소', sc:'training', mu:'C',
  L:[["", "1946년. 만석은 임시 초등교원양성소에 들어갔다."], ["강사", "여러분은 석 달 뒤 교단에 섭니다."], ["양성소 동기", "석 달이요? 사범학교는 몇 해씩 다닌다던데."], ["강사", "그걸 기다릴 수가 없습니다. 교사도, 교과서도, 교실도 다 모자랍니다."], ["", "쉬는 시간, 동기가 만석의 어깨를 툭 쳤다."], ["양성소 동기", "만석이 자네는 무얼 가르치고 싶은가?"], ["정만석", "우리말이오. 학교 다닐 때 제대로 배워 본 적이 없소."], ["양성소 동기", "허허, 그럼 자네 반 아이들이 자네 선생이 되겠구먼."], ["정만석", "그래도 좋소. 같이 배우면 되지."], ["", "그해 가을, 만석은 순천 근교의 국민학교로 발령받았다."]],
  card:['교사를 급히 채우려 도마다 임시 초등교원양성소를 세웠다. 1946년에만 24곳, 기간은 2개월~1년이었다.'],
  src:[['기록원','국가기록원 — 교원양성 정책 주제설명','https://www.archives.go.kr/next/search/listSubjectDescription.do?id=003190']]},

 {y:'1948.10', age:21, t:'새 국어책', role:'교사', place:'전남 순천 근교 국민학교', sc:'book', mu:'A',
  L:[["", "1948년 10월. 교무실에 교과서 꾸러미가 도착했다."], ["동료 교사", "정 선생, 새 국어책이오! 정부가 서고 나서 처음 만든 국어책이랍디다."], ["정만석", "우리 손으로 만든 책이로군. 종이 냄새부터 다르오."], ["", "만석은 1학년 교실에 책을 한 권씩 나눠 주었다."], ["아이", "선생님, 개 그림이 있어요!"], ["아이", "얘가 바둑이고, 이 애가 철수래요."], ["정만석", "그래, 순길아. 학교 앞 누렁이보다 낫냐?"], ["아이", "누렁이가 더 이뻐요!"], ["정만석", "허허. 오늘부터 이 책으로 공부한다. 다 같이 따라 읽어라."]],
  card:['1948년 10월 5일 『바둑이와 철수』가 나왔다. 정부 수립 뒤 처음 펴낸 국어 교과서다.',
        '2006년 교과서 연구단체가 이날을 ‘교과서의 날’로 정했다.'],
  src:[['2차','한국민족문화대백과 — 바둑이와 철수','https://encykorea.aks.ac.kr/Article/E0075681'],

        <li><a href="https://www.seoul.co.kr/news/1990/12/15/19901215015001" target="_blank" rel="noopener">서울신문 1990 — 2020 원문 기사</a> — 여교사 비율·교과전담·열린 교육·초등 영어·급식·NEIS</li>
        <li><a href="https://theme.archives.go.kr/next/koreaOfRecord/cafeteria.do" target="_blank" rel="noopener">국가기록원, 기록으로 보는 대한민국</a> — 학교급식</li>
        <li><a href="https://hangyo.com/news/article.html?no=1058" target="_blank" rel="noopener">한국교육신문</a> — 교원 정년 단축·교실 정보화·인권조례·청탁금지법 보도</li>
        <li><a href="https://www.khan.co.kr/article/202212091015001" target="_blank" rel="noopener">진실화해위원회 전교조 해직 사건 규명 보도</a> (경향신문 2022)</li>
        <li><a href="http://www.kice.re.kr" target="_blank" rel="noopener">권점례 외(2020), COVID-19 대응 온라인 개학에 따른 초, 중, 고등학교 원격 수업 실태 및 개선 방향 탐색(한국교육과정평가원)</a></li>
        <li>서울신문 · 주간경향 · 머니투데이 · 헤럴드경제 · 동행미디어 시대 보도</li>
      `,
    end:['2부 끝','윤혜경 · 교단 40년','1987년 쉰두 명의 이름으로 시작한 그는<br>2027년 2월 교단을 떠난다.<br>출석부는 서도윤에게 건너갔다.',''],endSc:'s2_last',music:true}
};
let curPart=1, EV=EV1;
const pm=(k,v)=>setMusic(k&&curPart===2?P2K[k]:k, v);

const $=id=>document.getElementById(id);
let ei=-1, queue=[], typing=null, full='', phase='idle', log=[];
function paintProg(){const n=EV.length,box=$('prog');if(box.children.length!==n)box.innerHTML='<i></i>'.repeat(n);[...box.children].forEach((el,i)=>{el.className=i<ei?'d':i===ei?'c':''})}
function hud(e){$('hYear').textContent=e.y;$('hAge').textContent=e.age==null?'':e.age+'세';$('hRole').textContent=e.role;$('hPlace').textContent=e.place}
function startEvent(i){
  ei=i; paintProg(); const e=EV[i]; curAge=e.age; curScene=e.sc; sceneT0=performance.now(); hud(e);
  queue=e.L.slice(); $('txt').textContent=''; $('who').classList.add('hid'); $('choices').innerHTML=''; $('next').style.visibility='hidden';
  $('bYear').textContent=e.age==null?e.y:e.y+' · '+e.age+'세'; $('bTitle').textContent=e.t; $('banner').classList.add('on'); phase='banner';
  pm(e.mu==='off'||!e.mu?null:e.mu, LV[e.mu]||0); chime();
  clearTimeout(startEvent.tm); startEvent.tm=setTimeout(endBanner,1800);
}
function endBanner(){ if(phase!=='banner')return; $('banner').classList.remove('on'); phase='lines'; nextLine() }
function nextLine(){
  $('choices').innerHTML='';
  if(!queue.length){phase='cardwait';$('next').style.visibility='hidden';clearTimeout(openCard.tm);openCard();return}
  const it=queue.shift();
  if(it.choice){showChoice(it.choice);return}
  const [who,text]=it;
  const w=$('who'); w.classList.toggle('hid',!who); w.textContent=who||'·'; $('txt').classList.toggle('nar',!who);
  typeText(text);
}
function typeText(text){
  full=text; let k=0; $('txt').textContent=''; $('next').style.visibility='hidden'; phase='typing';
  clearTimeout(typing);
  const step=()=>{
    k++; const ch=full[k-1]; $('txt').textContent=full.slice(0,k);
    if(ch&&!/\s|[.,…!?·]/.test(ch)) blip();
    if(k>=full.length){typing=null;phase='lines';$('next').style.visibility='visible';return}
    const d=/[.!?]/.test(ch)?320:/[,…]/.test(ch)?200:68;
    typing=setTimeout(step,d);
  };
  typing=setTimeout(step,120);
}
function showChoice(opts){
  phase='choice'; $('next').style.visibility='hidden';
  const box=$('choices');
  opts.forEach(([label,reply])=>{const b=document.createElement('button');b.className='btn';b.textContent='▶ '+label;
    b.onclick=ev=>{ev.stopPropagation();queue=reply.concat(queue);box.innerHTML='';phase='lines';nextLine()};box.appendChild(b)});
}
function openCard(){
  const e=EV[ei]; phase='card'; [...$('prog').children].forEach((el,i)=>{if(i<=ei)el.className='d'});
  log.push({y:e.y,a:e.age,t:e.t});
  $('cYear').textContent=(curPart===0?'따라 하기 · ':'그때는 · ')+e.y; $('cTitle').textContent=e.t;
  $('cBody').innerHTML=e.card.map(p=>'<p>'+p+'</p>').join('');
  $('cSrc').innerHTML=e.src.map(([k,l,u])=>'<div><span class="tag '+(S[k]||'t5')+'">'+k+'</span><a href="'+u+'" target="_blank" rel="noopener">'+l+'</a></div>').join('');
  $('bCardNext').textContent= ei<EV.length-1 ? (curPart===0?'다음 단계로 ▶':'다음 해로 ▶') : (curPart===0?'마치기 ▶':curPart+'부 마치기 ▶');
  $('card').classList.add('on'); $('card').scrollTop=0;
  if(e.mu==='off'||!e.mu) pm('D',0.17);
}
function advance(){
  if(phase==='banner'){clearTimeout(startEvent.tm);endBanner();return}
  if(phase==='typing'){clearTimeout(typing);$('txt').textContent=full;phase='lines';$('next').style.visibility='visible';return}
  if(phase==='lines'){nextLine()}
}
$('dlg').addEventListener('click',advance);
$('stage').addEventListener('click',advance);
function anyOpen(){return ['confirm','log','card','menu','refs','end'].some(id=>$(id).classList.contains('on'))}
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){
  if(phase==='intro'){e.preventDefault();$('intro').click();return}
  if($('confirm').classList.contains('on'))return;
  if($('card').classList.contains('on')){e.preventDefault();$('bCardNext').click();return}
  if(!anyOpen()&&(phase==='banner'||phase==='typing'||phase==='lines')){e.preventDefault();advance()}}});
$('bCardNext').onclick=()=>{$('card').classList.remove('on'); if(ei<EV.length-1) startEvent(ei+1); else showEnd()};
function showEnd(){const P=PARTS[curPart];store.set('tr_clear'+curPart,true);phase='end';curScene=P.endSc;$('endH2').textContent=P.end[0];$('endH3').textContent=P.end[1];$('endP').innerHTML=P.end[2];$('endNext').textContent=P.end[3];$('endNext').style.display=P.end[3]?'':'none';$('end').classList.add('on');$('end').scrollTop=0;pm('D',0.27)}

const primed={};
function prime(keys){ keys.forEach(k=>{ if(primed[k]) return; primed[k]=true; const a=TR[k]; a.preload='auto'; if(lvl[k]===0 && !(want.key===k)){ const p=a.play(); if(p&&p.then) p.then(()=>{ if(lvl[k]===0 && want.key!==k) a.pause(); }).catch(()=>{}); } }); }
function unlock(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended') ac.resume().catch(()=>{});
  ensureNodes();
  prime(['M']);
}
document.addEventListener('pointerdown',()=>{const first=!ac;unlock();if(first&&$('menu').classList.contains('on'))setMusic('M',0.3)},{capture:true});
function closeAll(){['menu','refs','intro','card','log','end','confirm'].forEach(id=>$(id).classList.remove('on'))}
let introTimer=null, introFull='';
function goMenu(){clearTimeout(typing);clearTimeout(openCard.tm);clearTimeout(startEvent.tm);clearInterval(introTimer);introTimer=null;phase='idle';closeAll();$('banner').classList.remove('on');$('menu').classList.add('on');$('app').classList.remove('p2');paintMenu();menuPin=0;curScene='title';setMusic('M',0.3)}
document.querySelectorAll('.goMenu').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();goMenu()}));
$('bHome').onclick=e=>{e.stopPropagation();$('confirm').classList.add('on')};
$('bYes').onclick=goMenu;
$('bNo').onclick=()=>$('confirm').classList.remove('on');
function openPart(n){
  unlock(); prime(n===2?['E','F','G','H']:['A','B','C','D']); curPart=n; EV=PARTS[n].EV; closeAll(); $('app').classList.toggle('p2',n===2);
  $('hName').textContent=PARTS[n].name; $('refsPart').textContent=n+'부 · '+PARTS[n].name; $('refsList').innerHTML=PARTS[n].refs;
  $('refs').classList.add('on'); $('refs').scrollTop=0; phase='refs'; pm('D',0.22); sizeDlg();
  if(n===0) $('bRefsGo').onclick();
}
document.querySelector('#menu .big').addEventListener('click',()=>openPart(0));
$('p1').onclick=()=>openPart(1);
$('p2').onclick=()=>{if(store.get('tr_clear1',false))openPart(2)};
function paintMenu(){const ok=!!store.get('tr_clear1',false);$('p2').classList.toggle('locked',!ok);$('p2').disabled=!ok;$('p2y').textContent=ok?'1987 — 2027':'잠겨 있음'}
['p1','p2'].forEach((id,i)=>{$(id).addEventListener('pointerenter',()=>{menuPin=i+1});$(id).addEventListener('pointerleave',()=>{menuPin=0})});
paintMenu();
$('bRefsGo').onclick=()=>{
  closeAll(); $('intro').classList.add('on'); phase='intro'; setMusic(null,0); ei=-1; paintProg();
  const e=EV[0]; curAge=e.age; curScene=e.sc; hud(e);
  introFull=PARTS[curPart].intro; let k=0; $('introTxt').textContent=''; $('introNext').style.visibility='hidden';
  clearInterval(introTimer);
  introTimer=setInterval(()=>{k++;const ch=introFull[k-1];$('introTxt').textContent=introFull.slice(0,k);if(ch&&!/\s|[.,]/.test(ch))blip();
    if(k>=introFull.length){clearInterval(introTimer);introTimer=null;$('introNext').style.visibility='visible'}},110);
};
$('intro').onclick=()=>{
  if(introTimer){clearInterval(introTimer);introTimer=null;$('introTxt').textContent=introFull;$('introNext').style.visibility='visible';return}
  $('intro').classList.remove('on'); log=[]; startEvent(0);
};
function openLog(){$('logList').innerHTML=log.length?log.map(l=>'<li><b>'+l.y+(l.a==null?'':' · '+l.a+'세')+'</b>'+l.t+'</li>').join(''):'<li>아직 기록이 없습니다.</li>';$('log').classList.add('on')}
$('bLog').onclick=e=>{e.stopPropagation();openLog()};
$('bEndLog').onclick=openLog;
$('bLogClose').onclick=()=>$('log').classList.remove('on');


/* 대화창 높이: 현재 부의 가장 긴 대사가 들어가는 높이로 고정 */
function sizeDlg(){
  const d=$('dlg'), m=$('dlgM'); if(!d.clientWidth) return;
  m.className=''; m.style.cssText=''; 
  const cs=getComputedStyle(d);
  m.style.width=d.offsetWidth+'px'; m.style.padding=cs.padding; m.style.boxSizing='border-box'; m.style.border=cs.border;
  const wM=$('whoM'), tM=$('txtM'), cM=$('choicesM');
  wM.textContent='윤혜경';
  let mx=0, prev='';
  const meas=(txt,ch)=>{tM.textContent=txt;cM.innerHTML='';if(ch)ch.forEach(([l])=>{const b=document.createElement('button');b.className='btn';b.textContent='▶ '+l;cM.appendChild(b)});mx=Math.max(mx,m.offsetHeight)};
  const walk=L=>L.forEach(it=>{ if(it.choice){meas(prev,it.choice);it.choice.forEach(([,r])=>walk(r))} else {prev=it[1];meas(it[1])} });
  EV.forEach(e=>walk(e.L));
  const cap=Math.round(window.innerHeight*0.5);
  d.style.height=Math.min(mx+4,cap)+'px'; d.style.overflowY=mx+4>cap?'auto':'hidden';
}
window.addEventListener('resize',()=>{clearTimeout(sizeDlg.t);sizeDlg.t=setTimeout(sizeDlg,80)});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sizeDlg);
sizeDlg();

/* 소리 단추 */
function paintSound(){
  $('mute').classList.toggle('off',!soundOn); $('mute').textContent=soundOn?'♪':'×';
  $('vMusic').value=Math.round(musicVol*100); $('vSfx').value=Math.round(sfxVol*100);
  $('vMusicV').textContent=Math.round(musicVol*100); $('vSfxV').textContent=Math.round(sfxVol*100);
}
function applyNow(){ Object.keys(TR).forEach(k=>{clearTimeout(fades[k]);clearInterval(fades[k]);const v=soundOn&&k===want.key?want.vol*musicVol:0;if(v>0){setLevel(k,v);if(TR[k].paused)TR[k].play().catch(()=>{})}else stopTrack(k)}) }
$('mute').onclick=e=>{e.stopPropagation();unlock();soundOn=!soundOn;store.set('tr_on',soundOn);paintSound();setMusic(want.key,want.vol)};
$('bVol').onclick=e=>{e.stopPropagation();unlock();$('snd').classList.toggle('on')};
$('bVolClose').onclick=e=>{e.stopPropagation();$('snd').classList.remove('on')};
$('snd').addEventListener('click',e=>e.stopPropagation());
$('vMusic').oninput=e=>{musicVol=e.target.value/100;store.set('tr_music2',musicVol);paintSound();applyNow()};
$('vSfx').oninput=e=>{sfxVol=e.target.value/100;store.set('tr_sfx',sfxVol);paintSound();blip()};
paintSound();
</script>
